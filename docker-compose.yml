version: "3.9"

services:

  account-service:
    build:
      context: ./application/account-service
    container_name: account-service
    ports:
      - "5001:5000"

  payment-service:
    build:
      context: ./application/payment-service
    container_name: payment-service
    ports:
      - "5002:5000"

  transaction-service:
    build:
      context: ./application/transaction-service
    container_name: transaction-service
    ports:
      - "5003:5000"

  frontend:
    build:
      context: ./application/frontend
    container_name: frontend
    ports:
      - "5000:5000"

    depends_on:
      - account-service
      - payment-service
      - transaction-service