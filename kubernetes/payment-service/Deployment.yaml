apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: banking

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
      - name: payment-service
        image: enterprisebankacr.azurecr.io/payment-service:v1
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5002